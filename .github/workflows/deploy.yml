name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: python-aws-platform-demo-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test before deployment
        run: |
          python -m pip install -r requirements-dev.txt
          ruff check app tests
          python -m unittest discover -s tests -v
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: aws sts get-caller-identity
      - name: Package Lambda
        run: |
          cd app
          zip -r ../terraform/lambda.zip . -x "__pycache__/*" "*.pyc"
      
      - name: Diagnose backend variable
        env:
          CHECK_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if [ -n "$CHECK_BUCKET" ]; then
            echo "Repository variable is available."
          else
            echo "Repository variable is unavailable to this workflow."
            exit 1
          fi

      - name: Create backend config
        run: |
          test -n "$TF_STATE_BUCKET"
          test -n "$AWS_REGION"
          cat > terraform/backend.hcl <<EOF
          bucket       = "$TF_STATE_BUCKET"
          key          = "python-aws-platform-demo/terraform.tfstate"
          region       = "$AWS_REGION"
          encrypt      = true
          use_lockfile = true
          EOF
      - run: terraform -chdir=terraform init -backend-config=backend.hcl
      - name: Validate
        run: |
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform validate
      - name: Plan
        run: terraform -chdir=terraform plan -out=tfplan
      - name: Apply
        run: terraform -chdir=terraform apply -auto-approve tfplan
      - name: Verify endpoint
        run: |
          URL="$(terraform -chdir=terraform output -raw function_url)"
          echo "Application URL: $URL"
          curl --fail --silent --show-error "$URL"
